<script>

// ================= LOGIN =================
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const feedback = document.getElementById("loginFeedback");

  if(!email || !password){
    feedback.innerText = "Preencha tudo!";
    return;
  }

  const { data, error } = await client.auth.signInWithPassword({email, password});

  if(error){
    const { data: newUser, error: regError } = await client.auth.signUp({email, password});
    if(regError){
      feedback.innerText = regError.message;
      return;
    }
    user = newUser.user;
    feedback.innerText = "Conta criada!";
  } else {
    user = data.user;
  }

  abrirApp();
}

// ================= LOGOUT =================
async function logout(){
  await client.auth.signOut();
  location.reload();
}

// ================= UI =================
function abrirApp(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("appBox").style.display = "block";
  initInputs();
  criarGrafico();
}

// ================= ATIVOS =================
const ativos = ["BTC","AAPL","NVDA","SPY"];
let pesos = [0.30,0.25,0.20,0.25];
const retornos = [0.15,0.12,0.18,0.10];
const riscos = [0.40,0.30,0.35,0.20];

let chart;

// ================= INPUTS =================
function initInputs(){
  const container = document.getElementById("inputsPesos");
  container.innerHTML = "";

  ativos.forEach((ativo,i)=>{
    const input = document.createElement("input");
    input.type="number";
    input.min = 0;
    input.max = 100;
    input.value=pesos[i]*100;

    input.onchange=()=>{
      pesos[i]=Math.min(Math.max(input.value/100,0),1);
      criarGrafico();
    };

    container.appendChild(input);
  });
}

// ================= CÁLCULO =================
function calcular(){
  let retorno=0, risco=0;

  for(let i=0;i<pesos.length;i++){
    retorno+=pesos[i]*retornos[i];
    risco+=pesos[i]*riscos[i];
  }

  document.getElementById("resultado").innerHTML =
    `Retorno: ${(retorno*100).toFixed(2)}% | Risco: ${(risco*100).toFixed(2)}%`;
}

// ================= OTIMIZAÇÃO PRO =================
function otimizarPortfolioPro(){

  const rf = 0.02;
  const maxRisco = 0.35;
  const maxPeso = 0.5;

  let melhor = null;
  let melhorScore = -Infinity;

  for(let i=0;i<2000;i++){

    let w = [];
    let soma = 0;

    for(let j=0;j<ativos.length;j++){
      let val = Math.random();
      w.push(val);
      soma += val;
    }

    w = w.map(v => v / soma);

    // Limite por ativo
    if(w.some(v => v > maxPeso)) continue;

    let retorno = 0;
    let risco = 0;

    for(let k=0;k<w.length;k++){
      retorno += w[k] * retornos[k];
      risco += w[k] * riscos[k];
    }

    // Limite de risco
    if(risco > maxRisco) continue;

    let sharpe = (retorno - rf) / risco;

    // Penalização por concentração
    let diversificacao = w.reduce((acc,v)=> acc + Math.pow(v,2),0);
    let penalidade = diversificacao * 0.2;

    let score = sharpe - penalidade;

    if(score > melhorScore){
      melhorScore = score;
      melhor = {w, retorno, risco, sharpe};
    }
  }

  if(melhor){
    pesos = melhor.w;

    document.getElementById("resultado").innerHTML = `
    <br><strong>Alocação Ótima Automatizada:</strong><br>
    Retorno: ${(melhor.retorno*100).toFixed(2)}%<br>
    Risco: ${(melhor.risco*100).toFixed(2)}%<br>
    Sharpe: ${melhor.sharpe.toFixed(2)}
    `;

    criarGrafico();
  }
}

// ================= SALVAR =================
async function salvarPortfolio(){
  if(!user){
    alert("Faça login");
    return;
  }

  const name = prompt("Nome do portfólio:");
  if(!name) return;

  const { error } = await client
    .from("portfolios")
    .insert([{
      name,
      owner_id: user.id,
      data: {ativos, pesos}
    }]);

  if(error){
    alert(error.message);
  } else {
    alert("Portfólio salvo!");
  }
}
