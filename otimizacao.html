<script>
// ================= SUPABASE CONFIG =================
const SUPABASE_URL = "https://dcfaxuoamqdsjwsugvpu.supabase.co";
const SUPABASE_KEY = "sb_publishable_wFSv9W-PSccpep9ApyVtTA_5NzDbXvd";

const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;

// ================= AUTO LOGIN =================
async function checkUser(){
  const { data } = await client.auth.getUser();
  if(data.user){
    user = data.user;
    abrirApp();
  }
}
checkUser();

// ================= LOGIN =================
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const feedback = document.getElementById("loginFeedback");

  if(!email || !password){
    feedback.innerText = "Preencha tudo!";
    return;
  }

  const { data, error } = await client.auth.signInWithPassword({email, password});

  if(error){
    const { data: newUser, error: regError } = await client.auth.signUp({email, password});
    if(regError){
      feedback.innerText = regError.message;
      return;
    }
    user = newUser.user;
    feedback.innerText = "Conta criada!";
  } else {
    user = data.user;
  }

  abrirApp();
}

// ================= LOGOUT =================
async function logout(){
  await client.auth.signOut();
  location.reload();
}

// ================= UI =================
function abrirApp(){
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("appBox").style.display = "block";
  initInputs();
  criarGrafico();
}

// ================= ATIVOS =================
const ativos = ["BTC","AAPL","NVDA","SPY"];
let pesos = [0.30,0.25,0.20,0.25];
const retornos = [0.15,0.12,0.18,0.10];
const riscos = [0.40,0.30,0.35,0.20];

let chart;

// ================= INPUTS =================
function initInputs(){
  const container = document.getElementById("inputsPesos");
  container.innerHTML = "";

  ativos.forEach((ativo,i)=>{
    const input = document.createElement("input");
    input.type="number";
    input.value=pesos[i]*100;

    input.onchange=()=>{
      pesos[i]=input.value/100;
      criarGrafico();
    };

    container.appendChild(input);
  });
}

// ================= CÁLCULO =================
function calcular(){
  let retorno=0, risco=0;

  for(let i=0;i<pesos.length;i++){
    retorno+=pesos[i]*retornos[i];
    risco+=pesos[i]*riscos[i];
  }

  document.getElementById("resultado").innerHTML =
    `Retorno: ${(retorno*100).toFixed(2)}% | Risco: ${(risco*100).toFixed(2)}%`;
}

// ================= GRÁFICO =================
function criarGrafico(){
  const ctx = document.getElementById("grafico");

  if(chart) chart.destroy();

  chart = new Chart(ctx, {
    type:"pie",
    data:{
      labels:ativos,
      datasets:[{
        data:pesos.map(p=>p*100)
      }]
    }
  });
}

// ================= SALVAR =================
async function salvarPortfolio(){
  if(!user){
    alert("Faça login");
    return;
  }

  const name = prompt("Nome do portfólio:");
  if(!name) return;

  const { error } = await client
    .from("portfolios")
    .insert([{
      name,
      owner_id: user.id,
      data: {ativos, pesos}
    }]);

  if(error){
    alert(error.message);
  } else {
    alert("Salvo!");
  }
}
</script>
