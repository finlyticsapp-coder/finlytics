<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finlytics AI</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background-color: #f4f4f4;
    margin: 20px;
    padding: 0;
  }
  h1 {
    color: #2c3e50;
  }
  #resultado {
    margin-top: 20px;
    font-size: 18px;
  }
  button {
    margin-top: 20px;
    padding: 10px 20px;
    font-size: 16px;
    background-color: #3498db;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 5px;
  }
  button:hover {
    background-color: #2980b9;
  }
  canvas {
    margin-top: 20px;
    max-width: 400px;
  }
</style>
</head>
<body>

<h1>Finlytics AI - Plataforma de Portfólio</h1>

<div id="resultado">Clique no botão para calcular o portfólio</div>
<canvas id="grafico"></canvas>
<button onclick="simulacaoMonteCarlo()">Simular 10 anos</button>

<script>
const pesos = [0.30, 0.25, 0.20, 0.25];
const retornos = [0.15, 0.12, 0.18, 0.10];
const riscos = [0.40, 0.30, 0.35, 0.20];

function calcular() {
  let retornoEsperado = 0;
  let riscoTotal = 0;

  for (let i = 0; i < pesos.length; i++) {
    retornoEsperado += pesos[i] * retornos[i];
    riscoTotal += pesos[i] * riscos[i];
  }

  document.getElementById("resultado").innerHTML =
    "Retorno esperado: " + (retornoEsperado * 100).toFixed(2) + "%<br>" +
    "Risco estimado: " + (riscoTotal * 100).toFixed(2) + "%";
}

function simulacaoMonteCarlo() {
  let simulacoes = 1000;
  let valorInicial = 10000;
  let resultados = [];

  for (let i = 0; i < simulacoes; i++) {
    let valor = valorInicial;
    for (let ano = 0; ano < 10; ano++) {
      let retornoAleatorio = (Math.random() * 0.20) - 0.05;
      valor = valor * (1 + retornoAleatorio);
    }
    resultados.push(valor);
  }

  let media = resultados.reduce((a, b) => a + b, 0) / simulacoes;

  document.getElementById("resultado").innerHTML +=
    "<br><br>Valor médio após 10 anos: $" + media.toFixed(2);
}

// Inicializa gráfico
const ctx = document.getElementById('grafico');
new Chart(ctx, {
  type: 'pie',
  data: {
    labels: ['BTC', 'AAPL', 'NVDA', 'SPY'],
    datasets: [{
      data: [30, 25, 20, 25],
      backgroundColor: ['#f1c40f', '#e74c3c', '#2ecc71', '#3498db']
    }]
  }
});

// Calcula retorno e risco inicial
calcular();
</script>

</body>
</html>
