<!DOCTYPE html>
<html lang="pt-BR">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Finlytics AI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<style>

body{
font-family:Arial;
background:#0f172a;
color:white;
margin:0;
padding:0;
}

.container{
max-width:900px;
margin:auto;
padding:40px 20px;
}

h1{
text-align:center;
margin-bottom:10px;
}

h2{
text-align:center;
color:#94a3b8;
margin-bottom:30px;
}

.buttons{
display:flex;
gap:10px;
justify-content:center;
flex-wrap:wrap;
}

button{
padding:12px 20px;
border:none;
background:#2563eb;
color:white;
border-radius:6px;
cursor:pointer;
font-size:16px;
}

button:hover{
background:#1d4ed8;
}

.result{
margin-top:30px;
text-align:center;
font-size:18px;
line-height:1.6;
}

.chart{
margin-top:40px;
}

canvas{
max-width:100%;
}

</style>

</head>

<body>

<div class="container">

<h1>Finlytics AI</h1>
<h2>Plataforma de análise de portfólio</h2>

<div class="buttons">
<button onclick="calcular()">Calcular Retorno & Risco</button>
<button onclick="simular()">Simulação Monte Carlo</button>
</div>

<div class="result" id="resultado"></div>

<div class="chart">
<canvas id="grafico"></canvas>
</div>

</div>

<script>

const pesos=[0.30,0.25,0.20,0.25]
const retornos=[0.15,0.12,0.18,0.10]
const riscos=[0.40,0.30,0.35,0.20]

const ativos=["BTC","AAPL","NVDA","SPY"]

let chart

function calcular(){

let retorno=0
let risco=0

for(let i=0;i<pesos.length;i++){

retorno+=pesos[i]*retornos[i]
risco+=pesos[i]*riscos[i]

}

document.getElementById("resultado").innerHTML=

"Retorno esperado: "+(retorno*100).toFixed(2)+"%<br>"+
"Risco estimado: "+(risco*100).toFixed(2)+"%"

}

function simular(){

let simulacoes=1000
let valorInicial=10000
let resultados=[]
let evolucao=[]

for(let i=0;i<simulacoes;i++){

let valor=valorInicial

for(let ano=0;ano<10;ano++){

let r=(Math.random()*0.20)-0.05
valor=valor*(1+r)

}

resultados.push(valor)

}

let media=resultados.reduce((a,b)=>a+b,0)/simulacoes

document.getElementById("resultado").innerHTML=

"Valor médio após 10 anos: $"+media.toFixed(2)

criarGraficoMonteCarlo()

}

function criarGraficoPortfolio(){

const ctx=document.getElementById("grafico")

if(chart){
chart.destroy()
}

chart=new Chart(ctx,{
type:"pie",
data:{
labels:ativos,
datasets:[{
data:pesos.map(p=>p*100),
backgroundColor:[
"#f59e0b",
"#3b82f6",
"#10b981",
"#ef4444"
]
}]
},
options:{
plugins:{
legend:{position:"bottom"}
}
}
})

}

function criarGraficoMonteCarlo(){

const ctx=document.getElementById("grafico")

if(chart){
chart.destroy()
}

let anos=[]
let valores=[]
let valor=10000

for(let i=0;i<=10;i++){

anos.push("Ano "+i)
valores.push(valor)

let r=(Math.random()*0.20)-0.05
valor=valor*(1+r)

}

chart=new Chart(ctx,{
type:"line",
data:{
labels:anos,
datasets:[{
label:"Simulação de crescimento",
data:valores
}]
},
options:{
plugins:{
legend:{display:true}
}
}
})

}

criarGraficoPortfolio()

</script>

</body>
</html>
