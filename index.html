<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finlytics AI - Plataforma de Portfólio</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
  body {
    font-family: Arial, sans-serif;
    background: #0f172a;
    color: white;
    margin: 0;
    padding: 20px;
  }
  .container {
    max-width: 900px;
    margin: auto;
    padding: 30px;
    background: #1e293b;
    border-radius: 10px;
  }
  h1, h2 {
    text-align: center;
    margin-bottom: 10px;
  }
  h2 { color: #94a3b8; margin-bottom: 30px; }
  .buttons {
    display: flex;
    gap: 10px;
    justify-content: center;
    flex-wrap: wrap;
    margin-bottom: 20px;
  }
  button {
    padding: 12px 20px;
    border: none;
    background: #2563eb;
    color: white;
    border-radius: 6px;
    cursor: pointer;
    font-size: 16px;
  }
  button:hover { background: #1d4ed8; }
  .result { margin-top: 20px; text-align: center; font-size: 18px; }
  canvas { margin-top: 30px; display: block; max-width: 100%; }
</style>
</head>
<body>
<div class="container">
  <h1>Finlytics AI</h1>
  <h2>Plataforma de análise de portfólio</h2>

  <div class="buttons">
    <button onclick="calcular()">Calcular Retorno & Risco</button>
    <button onclick="simularMonteCarlo()">Simulação Monte Carlo</button>
    <button onclick="otimizarSharpe()">Otimização Sharpe</button>
  </div>

  <div class="result" id="resultado"></div>

  <canvas id="graficoPizza"></canvas>
  <canvas id="graficoFronteira" height="400"></canvas>
</div>

<script>
  // ===============================
  // Dados do portfólio
  // ===============================
  const ativos = ["BTC","AAPL","NVDA","SPY"];
  const pesos = [0.30,0.25,0.20,0.25];
  const retornos = [0.15,0.12,0.18,0.10];
  const riscos = [0.40,0.30,0.35,0.20];
  let chartPizza, chartFronteira;

  // ===============================
  // Função: Retorno e Risco
  // ===============================
  function calcular() {
    let retorno=0, risco=0;
    for(let i=0;i<pesos.length;i++){
      retorno+=pesos[i]*retornos[i];
      risco+=pesos[i]*riscos[i];
    }
    document.getElementById("resultado").innerHTML =
      `Retorno esperado: ${(retorno*100).toFixed(2)}%<br>` +
      `Risco estimado: ${(risco*100).toFixed(2)}%`;

    desenharPizza();
  }

  // ===============================
  // Função: Simulação Monte Carlo
  // ===============================
  function simularMonteCarlo() {
    let simulacoes=1000, valorInicial=10000;
    let resultados=[];
    for(let i=0;i<simulacoes;i++){
      let valor=valorInicial;
      for(let ano=0;ano<10;ano++){
        valor*=1+(Math.random()*0.20-0.05);
      }
      resultados.push(valor);
    }
    resultados.sort((a,b)=>a-b);
    const media=resultados.reduce((a,b)=>a+b,0)/simulacoes;
    const min=resultados[0], max=resultados[simulacoes-1];
    const p25=resultados[Math.floor(simulacoes*0.25)];
    const p75=resultados[Math.floor(simulacoes*0.75)];

    document.getElementById("resultado").innerHTML +=
      `<br><br><strong>Monte Carlo (10 anos)</strong><br>`+
      `Média: $${media.toFixed(2)}<br>`+
      `Min: $${min.toFixed(2)}, Max: $${max.toFixed(2)}<br>`+
      `25%: $${p25.toFixed(2)}, 75%: $${p75.toFixed(2)}`;
  }

  // ===============================
  // Função: Gráfico de Pizza
  // ===============================
  function desenharPizza() {
    const ctx=document.getElementById("graficoPizza");
    if(chartPizza) chartPizza.destroy();
    chartPizza=new Chart(ctx,{
      type:"pie",
      data:{
        labels: ativos,
        datasets:[{
          data: pesos.map(p=>p*100),
          backgroundColor: ["#f59e0b","#3b82f6","#10b981","#ef4444"]
        }]
      },
      options:{plugins:{legend:{position:"bottom"}}}
    });
  }

  // ===============================
  // Função: Otimização Sharpe e Fronteira
  // ===============================
  function otimizarSharpe() {
    const rf=0.02;
    const passos=50;
    let melhorSharpe=-Infinity, melhorPort={};

    let pontos=[];
    for(let w1=0; w1<=1; w1+=1/passos){
      for(let w2=0; w2<=1-w1; w2+=1/passos){
        for(let w3=0; w3<=1-w1-w2; w3+=1/passos){
          let w4=1-w1-w2-w3;
          if(w4<0) continue;
          let r=w1*retornos[0]+w2*retornos[1]+w3*retornos[2]+w4*retornos[3];
          let s=Math.sqrt(Math.pow(w1*riscos[0],2)+Math.pow(w2*riscos[1],2)+
                          Math.pow(w3*riscos[2],2)+Math.pow(w4*riscos[3],2));
          pontos.push({x:s*100,y:r*100});
          let sharpe=(r-rf)/s;
          if(sharpe>melhorSharpe){
            melhorSharpe=sharpe;
            melhorPort={w:[w1,w2,w3,w4],x:s*100,y:r*100,sharpe};
          }
        }
      }
    }

    // Desenhar fronteira eficiente
    const ctx=document.getElementById("graficoFronteira");
    if(chartFronteira) chartFronteira.destroy();
    chartFronteira=new Chart(ctx,{
      type:"scatter",
      data:{
        datasets:[
          {label:"Fronteira eficiente",data:pontos,pointRadius:2,backgroundColor:"#36A2EB"},
          {label:"Melhor Sharpe",data:[{x:melhorPort.x,y:melhorPort.y}],pointRadius:6,backgroundColor:"#FF0000"}
        ]
      },
      options:{
        scales:{
          x:{title:{display:true,text:"Risco (%)"}},
          y:{title:{display:true,text:"Retorno (%)"}}
        }
      }
    });

    document.getElementById("resultado").innerHTML +=
      `<br><br><strong>Melhor Portfólio (Sharpe Ratio: ${melhorSharpe.toFixed(2)})</strong><br>`+
      `BTC: ${(melhorPort.w[0]*100).toFixed(1)}%<br>`+
      `AAPL: ${(melhorPort.w[1]*100).toFixed(1)}%<br>`+
      `NVDA: ${(melhorPort.w[2]*100).toFixed(1)}%<br>`+
      `SPY: ${(melhorPort.w[3]*100).toFixed(1)}%`;
  }

  // Inicializa gráfico de pizza ao carregar
  desenharPizza();
</script>
</body>
</html>
