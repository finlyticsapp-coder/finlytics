<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finlytics AI - Plataforma de Portfólio</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>
<style>
body { font-family: Arial; background: #0f172a; color: white; margin:0; padding:0; }
.container { max-width:900px; margin:auto; padding:40px 20px; }
h1, h2 { text-align:center; margin:0 0 15px 0; }
.buttons { display:flex; gap:10px; justify-content:center; flex-wrap:wrap; margin:20px 0; }
button { padding:12px 20px; border:none; background:#2563eb; color:white; border-radius:6px; cursor:pointer; font-size:16px; }
button:hover { background:#1d4ed8; }
.result { margin-top:30px; text-align:center; font-size:18px; }
.chart { margin-top:40px; }
.input-row { display:flex; justify-content:center; gap:10px; margin:10px 0; }
.input-row input { width:60px; padding:5px; border-radius:5px; border:none; text-align:center; }
.feedback { text-align:center; margin-top:15px; color:#10b981; font-weight:bold; }
.login { max-width:400px; margin:auto; background:#1e293b; padding:20px; border-radius:10px; margin-top:50px; }
.login input { width:100%; padding:10px; margin:10px 0; border-radius:5px; border:none; }
.login button { width:100%; }
</style>
</head>
<body>

<div class="login" id="loginBox">
<h2>Login Finlytics AI</h2>
<input type="email" id="email" placeholder="Email">
<input type="password" id="password" placeholder="Senha">
<button onclick="login()">Entrar / Registrar</button>
<div class="feedback" id="loginFeedback"></div>
</div>

<div class="container" id="appBox" style="display:none;">
<h1>Finlytics AI</h1>
<h2>Plataforma de análise de portfólio</h2>

<div class="buttons">
<button onclick="calcular()">Calcular Retorno & Risco</button>
<button onclick="simular()">Simulação Monte Carlo</button>
<button onclick="salvarPortfolio()">Salvar Portfólio</button>
</div>

<div class="input-row" id="inputsPesos"></div>
<div class="result" id="resultado"></div>
<div class="chart">
<canvas id="grafico"></canvas>
<canvas id="monteCarlo" style="margin-top:40px;"></canvas>
</div>
<div class="feedback" id="feedback"></div>
</div>

<script>
// ================= Supabase =================
const SUPABASE_URL = "COLE_AQUI_SUA_URL";
const SUPABASE_KEY = "COLE_AQUI_SUA_ANON_KEY";
const supabase = Supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
let user = null;

// ================= Ativos =================
const ativos = ["BTC","AAPL","NVDA","SPY"];
let pesos = [0.30,0.25,0.20,0.25];
const retornos = [0.15,0.12,0.18,0.10];
const riscos = [0.40,0.30,0.35,0.20];

let chart, monteChart;

// ================= Login =================
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  document.getElementById("loginFeedback").innerText = "";

  if(!email || !password){ 
    document.getElementById("loginFeedback").innerText = "Preencha todos os campos!";
    return;
  }

  // Tenta login
  const { user: loginUser, error } = await supabase.auth.signInWithPassword({email,password});
  if(error){
    // Se erro, tenta registrar
    const { user: newUser, error: regError } = await supabase.auth.signUp({email,password});
    if(regError){ document.getElementById("loginFeedback").innerText = regError.message; return;}
    user = newUser;
    document.getElementById("loginFeedback").innerText = "Registrado com sucesso!";
  } else { user = loginUser; }

  document.getElementById("loginBox").style.display="none";
  document.getElementById("appBox").style.display="block";
  initInputs();
  criarGrafico();
}

// ================= Interface de edição =================
function initInputs(){
  const container = document.getElementById("inputsPesos");
  container.innerHTML = "";
  ativos.forEach((ativo,i)=>{
    const input = document.createElement("input");
    input.type="number"; input.min=0; input.max=100; input.value=pesos[i]*100;
    input.onchange=()=>{pesos[i]=input.value/100; criarGrafico();}
    container.appendChild(input);
  });
}

// ================= Calcular =================
function calcular(){
  let retorno=0, risco=0;
  for(let i=0;i<pesos.length;i++){
    retorno+=pesos[i]*retornos[i];
    risco+=pesos[i]*riscos[i];
  }
  document.getElementById("resultado").innerHTML =
    "Retorno esperado: "+(retorno*100).toFixed(2)+"%<br>"+
    "Risco estimado: "+(risco*100).toFixed(2)+"%";
  criarGrafico();
}

// ================= Monte Carlo =================
function simular(){
  let simulacoes=1000, valorInicial=10000, resultados=[];
  for(let i=0;i<simulacoes;i++){
    let valor=valorInicial;
    for(let ano=0;ano<10;ano++){
      let r=(Math.random()*0.20)-0.05;
      valor*=1+r;
    }
    resultados.push(valor);
  }
  const media = resultados.reduce((a,b)=>a+b,0)/simulacoes;
  document.getElementById("resultado").innerHTML += `<br><br>Valor médio após 10 anos: $${media.toFixed(2)}`;
  criarGraficoMonteCarlo(resultados);
}

// ================= Gráfico =================
function criarGrafico(){
  const ctx=document.getElementById("grafico");
  if(chart) chart.destroy();
  chart=new Chart(ctx,{
    type:"pie",
    data:{
      labels:ativos,
      datasets:[{data:pesos.map(p=>p*100), backgroundColor:["#f59e0b","#3b82f6","#10b981","#ef4444"]}]
    },
    options:{plugins:{legend:{position:"bottom"}}}
  });
}

function criarGraficoMonteCarlo(resultados){
  const ctx=document.getElementById("monteCarlo");
  if(monteChart) monteChart.destroy();
  monteChart=new Chart(ctx,{
    type:"line",
    data:{labels:resultados.map((_,i)=>i+1), datasets:[{label:"Simulação", data:resultados, borderColor:"#36a2eb", fill:false}]},
    options:{plugins:{legend:{display:false}}, scales:{x:{title:{display:true,text:"Simulação"}},y:{title:{display:true,text:"Valor"}}}}
  });
}

// ================= Salvar Portfólio =================
async function salvarPortfolio(){
  if(!user){ document.getElementById("feedback").innerText="Faça login antes!"; return; }
  const name = prompt("Nome do portfólio:");
  if(!name){ document.getElementById("feedback").innerText="Nome inválido."; return; }
  const { data, error } = await supabase.from("portfolios").insert([{name, owner_id:user.id, assets:JSON.stringify(pesos)}]);
  if(error){ document.getElementById("feedback").innerText=error.message; } 
  else { document.getElementById("feedback").innerText="Portfólio salvo com sucesso!"; }
}
</script>

</body>
</html>
