<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Finlytics AI</title>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js"></script>

<style>
body{font-family:Arial;background:#0f172a;color:white;text-align:center;}
button{padding:10px 20px;margin:5px;background:#2563eb;color:white;border:none;border-radius:5px;}
input{width:60px;text-align:center;}
</style>
</head>

<body>

<!-- LOGIN -->
<div id="loginBox">
  <h2>Login</h2>
  <input id="email" placeholder="Email"><br><br>
  <input id="password" type="password" placeholder="Senha"><br><br>
  <button onclick="login()">Entrar</button>
  <div id="loginFeedback"></div>
</div>

<!-- APP -->
<div id="appBox" style="display:none;">
  <h1>Finlytics AI</h1>

  <div id="inputsPesos"></div>

  <br>
  <button onclick="calcular()">Calcular</button>
  <button onclick="otimizarPortfolioPro()">IA PRO</button>
  <button onclick="salvarPortfolio()">Salvar</button>
  <button onclick="logout()">Sair</button>

  <div id="resultado"></div>

  <canvas id="grafico"></canvas>
</div>

<script>

// ================= SUPABASE =================
const SUPABASE_URL = "https://dcfaxuoamqdsjwsugvpu.supabase.co";
const SUPABASE_KEY = "eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImRjZmF4dW9hbXFkc2p3c3VndnB1Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3NzIzMjUzMjYsImV4cCI6MjA4NzkwMTMyNn0.IWYyvbWQKDEIcUnVmaY80E6PfwAzsa1jzH7ZgjCZ53I";

const client = supabase.createClient(SUPABASE_URL, SUPABASE_KEY);

let user = null;

// ================= AUTO LOGIN =================
async function checkUser(){
  const { data } = await client.auth.getUser();
  if(data.user){
    user = data.user;
    abrirApp();
  }
}
checkUser();

// ================= LOGIN =================
async function login(){
  const email = document.getElementById("email").value;
  const password = document.getElementById("password").value;
  const feedback = document.getElementById("loginFeedback");

  const { data, error } = await client.auth.signInWithPassword({email,password});

  if(error){
    const { data: newUser } = await client.auth.signUp({email,password});
    user = newUser.user;
    feedback.innerText = "Conta criada!";
  } else {
    user = data.user;
  }

  abrirApp();
}

// ================= LOGOUT =================
async function logout(){
  await client.auth.signOut();
  location.reload();
}

// ================= UI =================
function abrirApp(){
  document.getElementById("loginBox").style.display="none";
  document.getElementById("appBox").style.display="block";
  initInputs();
  criarGrafico();
}

// ================= ATIVOS =================
const ativos = ["BTC","AAPL","NVDA","SPY"];
let pesos = [0.3,0.25,0.2,0.25];
const retornos = [0.15,0.12,0.18,0.10];
const riscos = [0.40,0.30,0.35,0.20];

let chart;

// ================= INPUTS =================
function initInputs(){
  const c = document.getElementById("inputsPesos");
  c.innerHTML="";
  ativos.forEach((a,i)=>{
    const input=document.createElement("input");
    input.value=pesos[i]*100;
    input.onchange=()=>{
      pesos[i]=input.value/100;
      criarGrafico();
    };
    c.appendChild(input);
  });
}

// ================= CALCULAR =================
function calcular(){
  let r=0,s=0;
  for(let i=0;i<pesos.length;i++){
    r+=pesos[i]*retornos[i];
    s+=pesos[i]*riscos[i];
  }

  document.getElementById("resultado").innerHTML =
  `Retorno: ${(r*100).toFixed(2)}% | Risco: ${(s*100).toFixed(2)}%`;
}

// ================= IA PRO =================
function otimizarPortfolioPro(){

  let melhor=null;
  let melhorScore=-Infinity;

  for(let i=0;i<2000;i++){
    let w=[], soma=0;

    for(let j=0;j<ativos.length;j++){
      let v=Math.random();
      w.push(v); soma+=v;
    }

    w=w.map(v=>v/soma);

    let r=0,s=0;
    for(let k=0;k<w.length;k++){
      r+=w[k]*retornos[k];
      s+=w[k]*riscos[k];
    }

    let sharpe=(r-0.02)/s;

    if(sharpe>melhorScore){
      melhorScore=sharpe;
      melhor={w,r,s};
    }
  }

  pesos=melhor.w;

  document.getElementById("resultado").innerHTML =
  `IA PRO → Retorno: ${(melhor.r*100).toFixed(2)}%`;

  criarGrafico();
}

// ================= GRÁFICO =================
function criarGrafico(){
  const ctx=document.getElementById("grafico");
  if(chart) chart.destroy();

  chart=new Chart(ctx,{
    type:"pie",
    data:{
      labels:ativos,
      datasets:[{data:pesos.map(p=>p*100)}]
    }
  });
}

// ================= SALVAR =================
async function salvarPortfolio(){
  await client.from("portfolios").insert([{
    name:"portfolio",
    owner_id:user.id,
    assets:{pesos}
  }]);

  alert("Salvo!");
}

</script>

</body>
  </html>
